<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leegook | Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* 프로필 아바타 */
        .profile-avatar {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1f232d 0%, #12141a 100%);
            margin: 0 auto 16px;
            border: 2px solid #2d3240;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
            color: #ffffff;
        }

        .profile-bio {
            font-size: 0.92rem;
            color: #8e94a5;
            margin-bottom: 28px;
            line-height: 1.45;
            font-weight: 400;
        }

        /* 링크 버튼 영역 */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.01em;
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .link-btn.exclusive {
            background: linear-gradient(135deg, #00aff0 0%, #0084c7 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 6px 20px rgba(0, 175, 240, 0.25);
        }

        .link-btn.exclusive:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        @media (hover: hover) {
            .link-btn.exclusive:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(0, 175, 240, 0.35);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 프로필 이미지 -->
        <div class="profile-avatar">
            <img src="profile.jpg" alt="profile">
        </div>
        
        <div id="ui-name" class="profile-name"></div>
        <div id="ui-bio" class="profile-bio"></div>

        <!-- 링크 목록 -->
        <div class="links-wrapper">
            <a id="ui-btn-exclusive" class="link-btn exclusive" href="#" target="_blank" rel="noopener noreferrer">Watch More</a>
        </div>
    </div>

    <script>
        // ==========================================
        // [수정 영역]
        // ==========================================
        const CONFIG = {
            profileName: "@leegook",
            profileBio: "My job is not just dancing content.",
            
            // 연결 주소
            targetUrl: "https://onlyfans.com/leegook"
        };

        // ==========================================
        // [화면 렌더링]
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("ui-name").innerText = CONFIG.profileName;
            document.getElementById("ui-bio").innerText = CONFIG.profileBio;
            
            const exclusiveBtn = document.getElementById("ui-btn-exclusive");
            exclusiveBtn.href = CONFIG.targetUrl;
        });
    </script>
</body>
</html>
